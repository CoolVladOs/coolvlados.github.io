
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 32px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    .description {
      color: #cbd5e1;
      line-height: 1.6;
    }

    .upload {
      display: block;
      margin: 28px 0 16px;
      padding: 32px 16px;
      border: 2px dashed #64748b;
      border-radius: 14px;
    }

    input {
      max-width: 100%;
      margin-top: 16px;
    }

    .limit {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 18px;
    }

    .status {
      min-height: 24px;
      color: #93c5fd;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 28px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>🎵 AudioDrop</h1>

    <p class="description">
      Загрузи аудио и получи ссылку,
      которой можно поделиться.
    </p>

    <div class="upload">
      <div>☁️ Выбери аудиофайл</div>

      <input
        type="file"
        id="audio"
        accept="audio/*"
      >

      <p class="limit">
        Максимальный размер: 100 МБ
      </p>
    </div>

    <p class="status" id="status">
      Скоро здесь появится загрузка файлов.
    </p>

    <footer>
      Временное хранение аудиофайлов
    </footer>
  </main>
</body>
</html>
